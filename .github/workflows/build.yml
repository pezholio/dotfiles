
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v2
    - name: Install ShellCheck
      run: brew install shellcheck
    - name: Run ShellCheck
      run: script/cibuild
    - name: Run Bootstrap script
      run: script/bootstrap
